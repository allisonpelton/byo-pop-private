<!-- Big Money's Replays panel on the shared page (web/shell.html gives it its bar button); page.js fills the list -->
<aside class="panel" id="panel-replays" data-button="Replays" hidden aria-labelledby="panel-replays-title" tabindex="-1">
  <header><h2 id="panel-replays-title">Replays</h2><button type="button" data-close>Close</button></header>
  <div class="body">
    <p class="note" id="replays-about">With the <span class="mono">replays</span> mod on, every finished game is kept here (the newest 50,
      and every one that made a high-score table). Watch one, or press R on the game-over screen to watch the game
      you just played. While watching: 1 to 4 for the speed, space to pause, Esc to stop.</p>
    <div class="row">
      <button type="button" data-pick="pick-replay" aria-describedby="replays-about replay-msg">Import .bmr</button>
      <input type="file" id="pick-replay" accept=".bmr" multiple hidden tabindex="-1" aria-hidden="true">
    </div>
    <ul class="replays" id="replay-list" aria-label="Replays"></ul>
    <p class="note" id="replay-msg" role="status"></p>
  </div>
</aside>
