<!-- Bejeweled's Replays panel on the shared page (web/shell.html gives it its bar button); page.js fills the list -->
<aside class="panel" id="panel-replays" data-button="Replays" hidden aria-label="Replays" tabindex="-1">
  <header><h2>Replays</h2><button type="button" data-close>Close</button></header>
  <div class="body">
    <p class="note">With the <span class="mono">replays</span> mod on, every finished game is kept here (the newest few,
      and every one that made a high-score table). Import a <span class="mono">.bjr</span> file to watch someone else's
      game. A replay plays at the game's speed and stops on its last board; New Game ends it.</p>
    <div class="row">
      <label class="button" for="pick-replay">Import .bjr</label>
      <input type="file" id="pick-replay" accept=".bjr" multiple>
    </div>
    <div class="replays" id="replay-list"></div>
    <p class="note" id="replay-msg"></p>
  </div>
</aside>
