# Heavy Weapon Deluxe for tools/visrun.py (docs/VISRUN.md): the original in 3D on the visible desktop, which neither Windows
# Sandbox nor rundesk gives it. idplay.py's shots3d step runs it with a tour's script for the original (its peeks dropped)
# and replays the port in 3D at the updates the shots landed on. Addresses from idplay.py: the app is the static object at
# 0x56b1a0; its mUpdateCount (+0x414), its count of updates not yet drawn (+0x3e0, 0x451307 adds, 0x45136d clears),
# mDDInterface (+0x328) and the interface's mIs3D (+0x38, read by 0x44d760, Is3DAccelerated).
name = "heavyweapon"
source_exe = "build/origrun/heavyweapon/game/HeavyWeaponGame.exe"   # the copy idplay.py prepares (the carved exe, the
                                      # pictures stored again as 8-bit PNGs, the players file and data of the tour)
patches = "tools/origrun/patches/heavyweapon.txt"   # written by idplay.py prepare: the seed ({seed}), the loading on the
                                      # main thread, the mouse, the refresh rate and the three starting values
title = "Heavy Weapon"
client = [640, 480]
clock = "virtual"
update_ms = 10
counter = "0x56b5b4"
drawn = ["0x56b580 == 0"]
flag3d = "[0x56b4c8]+0x38:1"
reg_key = 'Software\PopCap\HeavyWeapon'   # HKLM\SOFTWARE\PopCap\HeavyWeapon, which the stand-in's registry map puts under HKCU
reg_map = "popcap"
reg_3d_value = "Is3D"
reg_values = { ScreenMode = 0, CustomCursors = 0 }   # windowed, the system's cursor (as the sandbox runs)

[values]                              # logged at every step (steps.tsv), compared with the port's trace
score = "0x56bafc"
level = "0x56bb00"
lives = "0x56bb04"
ltime = "[0x56bac0]+0x17c"
tankxh = "[0x56bac0]+0x94"
killed = "[0x56bac0]+0x328"
wminput = "[0x56b47c]+0x64"
loaded = "0x56babc"                  # its low byte (values are 4-byte reads): the app's loading-done flag (+0x91c)

[cues]
loaded = "0x56babc:1 != 0"
