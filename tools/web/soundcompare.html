<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound pairs</title>
<!-- tools/web/soundcompare.py serves this page, development only: pairs of similar sounds judged by ear -->
<style>
  :root { --bg: #c0c0c0; --fg: #000; --row: #fff; --sel: #000080; --selfg: #fff; --yes: #c8f0c8; --no: #f0c8c8; --line: #808080; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 12px Tahoma, "MS Sans Serif", Arial, sans-serif; }
  #bar { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 4px 8px; display: flex;
         gap: 12px; align-items: center; flex-wrap: wrap; z-index: 1; }
  #bar b { font-weight: bold; }
  .keys span { border: 1px solid var(--line); padding: 0 4px; background: #fff; margin-right: 2px; }
  table { border-collapse: collapse; width: 100%; background: var(--row); }
  th, td { border-bottom: 1px solid #ddd; padding: 2px 4px; text-align: left; vertical-align: middle; }
  th { background: #e0e0e0; position: sticky; top: 29px; font-weight: normal; }
  tr.sel td { outline: 2px solid var(--sel); outline-offset: -2px; }
  tr.yes td.d { background: var(--yes); }
  tr.no td.d { background: var(--no); }
  tr.sep td { background: #e0e0e0; font-weight: bold; }
  td.p { color: #555; font-size: 11px; word-break: break-all; max-width: 260px; }
  td.n { color: #555; text-align: right; }
  td:has(button) { white-space: nowrap; }
  button { font: inherit; min-width: 24px; }
  button.on { font-weight: bold; box-shadow: inset 0 0 0 2px #000; }
  button.playing { background: #ffffa0; }
</style>
</head>
<body>
<div id="bar">
  <b id="count">0 / 0</b>
  <span id="save">-</span>
  <span class="keys"><span>A</span>A <span>B</span>B <span>Space</span>A→B <span>S</span>Similar <span>N</span>Not similar <span>↑</span><span>↓</span></span>
</div>
<table>
  <thead><tr><th>#</th><th>A</th><th></th><th>Path</th><th></th><th>B</th><th></th><th>Path</th><th></th><th>Env/Wave</th><th>Decision</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
"use strict";
var pairs = [], dec = {}, sel = 0, audio = new Audio(), chain = null;
var rows = document.getElementById("rows");

function play(src, btn, then) {
  audio.pause();
  if (chain) clearTimeout(chain);
  chain = null;
  document.querySelectorAll("button.playing").forEach(function (b) { b.classList.remove("playing"); });
  if (!src) return;
  audio = new Audio("snd/" + encodeURIComponent(src));
  if (btn) btn.classList.add("playing");
  audio.onended = function () {
    if (btn) btn.classList.remove("playing");
    if (then) chain = setTimeout(then, 300);
  };
  audio.play().catch(function () { if (btn) btn.classList.remove("playing"); });
}
function playA(i) { var r = rowOf(i); play(pairs[i].a.snd, r && r.querySelector(".pa")); }
function playB(i) { var r = rowOf(i); play(pairs[i].b.snd, r && r.querySelector(".pb")); }
function playAB(i) {
  var r = rowOf(i);
  play(pairs[i].a.snd, r && r.querySelector(".pab"), function () { play(pairs[i].b.snd, r && r.querySelector(".pab")); });
}
function rowOf(i) { return rows.querySelector('tr[data-i="' + i + '"]'); }

function side(s) {
  return "<td>" + esc(s.game) + "</td><td>" + esc(s.label || "") + "</td><td class=p>" + esc(s.file) + "</td>";
}
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function draw() {
  var h = "", last = "";
  pairs.forEach(function (p, i) {
    if (p.list !== last) {
      last = p.list;
      h += '<tr class=sep><td colspan=11>' + (p.list === "near" ? "Near matches" : "Turned down") + "</td></tr>";
    }
    var d = dec[p.key];
    h += '<tr data-i="' + i + '" class="' + (i === sel ? "sel " : "") + (d === "similar" ? "yes" : d === "not similar" ? "no" : "") + '">' +
      "<td class=n>" + (i + 1) + "</td>" + side(p.a) +
      '<td><button class=pa title="Play A"' + (p.a.snd ? "" : " disabled") + ">▶</button></td>" + side(p.b) +
      '<td><button class=pb title="Play B"' + (p.b.snd ? "" : " disabled") + '>▶</button> <button class=pab title="A then B">A→B</button></td>' +
      "<td class=n>" + p.env.toFixed(2) + " / " + p.wave.toFixed(2) + "</td>" +
      '<td class=d><button class="ys' + (d === "similar" ? " on" : "") + '">Similar</button> <button class="ns' + (d === "not similar" ? " on" : "") + '">Not similar</button></td></tr>';
  });
  rows.innerHTML = h;
  var n = pairs.filter(function (p) { return dec[p.key]; }).length;
  document.getElementById("count").textContent = n + " / " + pairs.length;
}
function select(i, scroll) {
  sel = Math.max(0, Math.min(pairs.length - 1, i));
  rows.querySelectorAll("tr.sel").forEach(function (r) { r.classList.remove("sel"); });
  var r = rowOf(sel);
  if (r) { r.classList.add("sel"); if (scroll) r.scrollIntoView({ block: "nearest" }); }
}
function decide(i, what) {
  dec[pairs[i].key] = what;
  var keep = sel;
  draw();
  select(keep);
  save();
}
function save() {
  var s = document.getElementById("save");
  s.textContent = "saving";
  fetch("decisions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dec) })
    .then(function (r) { s.textContent = r.ok ? "saved" : "not saved (" + r.status + ")"; })
    .catch(function () { s.textContent = "not saved"; });
}

rows.addEventListener("click", function (e) {
  var b = e.target.closest("button"), tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  var i = +tr.dataset.i;
  select(i);
  if (!b) return;
  if (b.classList.contains("pa")) playA(i);
  else if (b.classList.contains("pb")) playB(i);
  else if (b.classList.contains("pab")) playAB(i);
  else if (b.classList.contains("ys")) decide(i, "similar");
  else if (b.classList.contains("ns")) decide(i, "not similar");
});
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.altKey || e.metaKey || !pairs.length) return;
  var k = e.key.toLowerCase();
  if (k === "a") playA(sel);
  else if (k === "b") playB(sel);
  else if (k === " ") playAB(sel);
  else if (k === "s" || k === "n") { decide(sel, k === "s" ? "similar" : "not similar"); select(sel + 1, true); }
  else if (k === "arrowdown") select(sel + 1, true);
  else if (k === "arrowup") select(sel - 1, true);
  else return;
  e.preventDefault();
});

Promise.all([fetch("pairs.json").then(function (r) { return r.json(); }), fetch("decisions").then(function (r) { return r.json(); })])
  .then(function (v) {
    pairs = v[0];
    dec = v[1] || {};
    var first = pairs.findIndex(function (p) { return !dec[p.key]; });
    draw();
    select(first < 0 ? 0 : first, true);
    document.getElementById("save").textContent = Object.keys(dec).length ? "saved" : "-";
  });
</script>
</body>
</html>
