<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{jungle.title}}</title>
<link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- the site's text for the scripts (web/strings/en.txt, web/i18n.js) and its logo drawn inline (web/logo.js) -->
<script src="../strings.js"></script><script src="../logo.js"></script>
<style>
/* Jungle Juice (docs/WEB_PLAYER.md, "Jungle Juice"): the site's second page, which will hold decompilations made by other
   projects; every page of it lives under /jungle (web/jungle/, written into build/web/jungle/ by byopop_web_jungle() in
   cmake/ByopopWeb.cmake). For now it only says so. The colour tokens and the header are the listing page's (web/index.html). */
:root {
  --bg: #eceaf2;
  --panel: #ffffff;
  --fg: #1d1a29;
  --muted: #5d5872;
  --line: #d6d2e3;
  --accent: #6b3fd1;
  --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); }
/* The focus ring is always visible for the keyboard, and a player who asks for no motion gets none (the logo's lever) */
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
main, .site-header, footer {
  max-width: 960px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.site-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 24px; }
.site-header a { display: block; border-radius: var(--radius); }
.site-header img { display: block; max-width: 100%; height: auto; }
main { padding-block: 0 32px; }
.placeholder {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px;
}
h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
.placeholder p { margin: 0 0 12px; max-width: 60ch; }
.placeholder p:last-child { margin-bottom: 0; }
.back { color: var(--accent); font-weight: 600; }
footer { padding-block: 0 32px; color: var(--muted); font-size: 12.5px; }
footer p { margin: 0 0 8px; }
footer a { color: var(--accent); }
</style>
<!-- the site's look, Desktop 95, after the page's own style (web/skins.js, web/skins.css): in its window on the desktop -->
<link rel="stylesheet" href="../skins.css"><script src="../skins.js"></script>
</head>
<body>
<header class="site-header">
  <a href="../"><img class="logo-light" src="../logo.svg" alt="{{jungle.logo_alt}}" width="210" height="64"></a>
</header>
<main>
  <section class="placeholder" aria-labelledby="jungle-title">
    <h1 id="jungle-title">{{jungle.heading}}</h1>
    <p>{{jungle.intro}}</p>
    <p><a class="back" href="../">{{jungle.back}}</a></p>
  </section>
</main>
<footer>
  <p>{{index.footer.about}}</p>
  <p>{{index.footer.credit_html}}</p>
</footer>
</body>
</html>
